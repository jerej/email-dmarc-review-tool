[tool.poetry]
name = "dmarc-review-tool"
version = "0.1.0"
description = "Local Streamlit dashboard for daily DMARC aggregate report review"
authors = ["Jere Julian <github@stagerigger.com>"]
readme = "README.md"
packages = [{ include = "dmarc_review" }]

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
streamlit = ">=1.35.0"
pandas = ">=2.2.0"
python-dotenv = ">=1.0.1"
requests = ">=2.31.0"
google-api-python-client = ">=2.154.0"
google-auth-httplib2 = ">=0.2.0"
google-auth-oauthlib = ">=1.2.1"

[tool.poetry.group.dev.dependencies]

[tool.poetry.scripts]
dmarc-fetch = "dmarc_review.runner:main"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
